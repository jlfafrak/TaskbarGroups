[package]
name = "taskbar-groups"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Memory"] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
